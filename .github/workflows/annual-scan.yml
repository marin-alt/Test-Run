name: Annual Scan (past year)

# Manual only — never runs on a schedule. Searches every research, government
# and advocacy source in sources.yaml SEPARATELY, once per objective sub-goal
# (the `targets` list), for past-year publications (news sites and
# le.utah.gov are left out). Ideas that advance no sub-goal are skipped. Every
# idea that survives dedupe + the Utah-law check is listed, ranked, in a new
# "Annual Scan — <date>" tab with a "Full treatment? (Y)" column. Mark the ones
# you want, then run the "Full Treatment" workflow. Already-law ideas are only
# counted in the Scan Log, not listed.
on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's maximum; a year across every source takes hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        working-directory: scanner
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VAULT_SPREADSHEET_ID: ${{ vars.VAULT_SPREADSHEET_ID }}
          SCAN_OBJECTIVES: "All"
          SCAN_TIERS: "All"
          SCAN_DAYS: "365"
          SCAN_MAX: "all"
          SCAN_LABEL: "Annual"
          SCAN_SHOW_KILLED: "false"
          SCAN_MODE: "annual"
        run: python scan.py
