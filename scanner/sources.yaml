# TPP source registry. Add/remove sources here — no code changes needed.
# domain: used for Tavily domain-restricted search
# label:  human-readable name used in logs and email
# tier:   1 = always scan, 2 = scan, 3 = scan (lower weight in ranking notes)

objectives:
  - "1. Support Children & Families"
  - "2. Build the Middle Class"
  - "3. Strengthen Public Education"
  - "4. Ensure Individuals Can Meet Their Basic Needs"
  - "5. Fix Inefficient & Inequitable Systems"
  - "6. Promote Mental & Physical Health"
  - "7. Prevent Abuse, Violence, & Exploitation"

# Topic queries run against each source group (combined with domain filters).
# objectives: which of the 7 objectives the query serves. An empty list means
# the query is relevant to every objective. A focused scan (e.g. "objective 3
# only") runs only the queries matching its selected objectives.
queries:
  - {q: "Utah policy recommendations children families childcare",                 objectives: [1]}
  - {q: "Utah workforce wages middle class policy report",                         objectives: [2]}
  - {q: "Utah housing affordability policy recommendations",                       objectives: [2, 4]}
  - {q: "Utah policy report education funding teachers schools",                   objectives: [3]}
  - {q: "Utah food insecurity SNAP basic needs policy recommendations",            objectives: [4]}
  - {q: "Utah criminal justice reform policy report",                              objectives: [5, 7]}
  - {q: "Utah occupational licensing regulatory reform government efficiency",     objectives: [5]}
  - {q: "Utah behavioral health mental health policy recommendations",             objectives: [6]}
  - {q: "Utah domestic violence trafficking child abuse policy recommendations",   objectives: [7]}
  - {q: "state policy innovation legislation model bill 2026",                     objectives: []}

sources:
  # Tier 1 — Utah government & data
  - {domain: justice.utah.gov,        label: "CCJJ",                       tier: 1}
  - {domain: dcfs.utah.gov,           label: "DCFS",                       tier: 1}
  - {domain: dhhs.utah.gov,           label: "Utah DHHS",                  tier: 1}
  - {domain: ibis.utah.gov,           label: "Utah IBIS",                  tier: 1}
  - {domain: schools.utah.gov,        label: "USBE",                       tier: 1}
  - {domain: le.utah.gov,             label: "Utah Legislature",           tier: 1}
  # Tier 1 — Utah research institutes
  - {domain: gardner.utah.edu,        label: "Gardner Policy Institute",   tier: 1}
  - {domain: utahfoundation.org,      label: "Utah Foundation",            tier: 1}
  - {domain: usu.edu,                 label: "UWLP (USU)",                 tier: 1}
  - {domain: healthpolicyproject.org, label: "Utah Health Policy Project", tier: 1}
  # Tier 2 — Utah advocacy & civil society
  - {domain: utahchildren.org,        label: "Voices for Utah Children",   tier: 2}
  - {domain: sutherlandinstitute.org, label: "Sutherland Institute",       tier: 2}
  - {domain: libertas.institute,      label: "Libertas Institute",         tier: 2}
  - {domain: udvc.org,                label: "UDVC",                       tier: 2}
  - {domain: ywcautah.org,            label: "YWCA Utah",                  tier: 2}
  - {domain: disabilitylawcenter.org, label: "Disability Law Center",      tier: 2}
  - {domain: envisionutah.org,        label: "Envision Utah",              tier: 2}
